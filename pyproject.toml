[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifireconnect"
version = "0.2.0"
description = "Python module to test and ensure connectivity on a network which have stability problems on its wifi. Run on Ubuntu / Debian."
readme = "README.md"
authors = [
    {name = "Carlos A. Planchón", email = "bubbledoloresuruguay2@gmail.com"}
]


license = "MIT"
license-files = ["LICENSE"]

keywords = ["wifi", "connectivity", "networking"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
requires-python = ">=3.10"
dependencies = [
    "pingparsing",
    "typer"
]

[project.urls]
Repository = "https://github.com/carlosplanchon/wifireconnect"

[project.scripts]
wifireconnect = "wifireconnect.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wifireconnect*"]
