[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifireconnect"
version = "0.1.1"
description = "Python module to test and ensure connectivity on a network which have stability problems on traffic routing (link layer)."
readme = "README.md"
authors = [
    {name = "Carlos A. Planchón", email = "bubbledoloresuruguay2@gmail.com"}
]
license = {text = "MIT"}
keywords = ["wifi", "connectivity", "networking"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
requires-python = ">=3.9"
dependencies = [
    "pingparsing",
    "typer"
]

[project.urls]
Repository = "https://github.com/carlosplanchon/wifireconnect"

[project.scripts]
wifireconnect = "wifireconnect.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wifireconnect*"]
